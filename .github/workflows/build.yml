name: 打包部署

on:
  push:
    branches:
      - main
  # 允许在 Actions 页面手动重发，不必再空 commit
  workflow_dispatch:

# 生产发布串行排队，避免两次 rsync 交叉把目录写成旧包
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build
        run: pnpm build

      - name: Deploy to server
        uses: easingthemes/ssh-deploy@v4
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          SOURCE: "dist/"
          # 未配置 SERVER_TARGET 时沿用线上目录，避免漏 secret 直接发挂
          TARGET: ${{ secrets.SERVER_TARGET || '/data/typing' }}
          ARGS: "-avz --delete"

      # 产物分支只放 dist + SPA fallback，不再整仓删文件后 force push
      - name: Keep SPA fallback on build branch
        run: cp static.json dist/static.json

      - name: Deploy to build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: build
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
