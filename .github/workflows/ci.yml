name: CI

on:
  pull_request:
    branches:
      - main

# 同一 PR 连续推送时取消旧构建，只保留最新一次
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # pnpm build = type-check + vite build，合进 main 前先拦住编译/类型错误
      - name: Build
        run: pnpm build
